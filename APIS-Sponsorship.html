  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+1F900-1F90B, U+1F93B, U+1F946, U+1F984, U+1F996, U+1F9E9, U+1FA00-1FA6F, U+1FA70-1FA7C, U+1FA80-1FA89, U+1FA8F-1FAC6, U+1FACE-1FADC, U+1FADF-1FAE9, U+1FAF0-1FAF8, U+1FB00-1FBFF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d6e547ae-4791-490d-a940-dd484e8297d5\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d02d5cf0-b8de-40ac-97c2-de24f71c6eae\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b7642e8a-945c-4469-9862-9dc39f1721bd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* APIS brand palette, source of truth: the live site (apisinstitute.org).\n   The warmer, earthier set was chosen over the Pantone sheet in APIS_Color_Palette.pdf;\n   the Pantone equivalents are noted per token for print matching. */\n:root{\n  /* Base, brand nine */\n  --apis-off-black:#1c1208;   /* warm black        · Pantone Neutral Black C */\n  --apis-off-white:#fdf9f1;   /* warm cream        · Pantone 000C White */\n  --apis-light-green:#8d9a6b; /* sage              · Pantone 4178 C */\n  --apis-dark-green:#4a5c2a;  /* forest olive      · Pantone 7749 C */\n  --apis-clay:#c99a7f;        /* clay              · Pantone 6030 C */\n  --apis-terracotta:#8b3a1e;  /* brick terracotta  · Pantone 2436 C */\n  --apis-yellow-1:#e8bd6d;    /* honey, light     · Pantone 148 C */\n  --apis-yellow-2:#c8842a;    /* burnt gold, mid  · Pantone 1355 C */\n  --apis-yellow-3:#a86a1e;    /* deep gold         · Pantone 4025 C */\n\n  /* Derived, used in production for hover/press and tinted grounds */\n  --apis-terracotta-dark:#6f2d14;\n  --apis-cream-sage:#f3e9d7;  /* off-white + green tint */\n  --apis-cream-clay:#f7ece0;  /* off-white + clay tint */\n  --apis-paper:#fffdf9;       /* default page ground, a whisper off white */\n  --apis-cream-light:#f8f1e6; /* lighter tinted ground */\n\n  /* Semantic, surfaces */\n  --surface-page:var(--apis-paper);      /* white by default; reach for a tint only to separate a band */\n  --surface-alt:var(--apis-cream-sage);\n  --surface-alt-warm:var(--apis-cream-clay);\n  --surface-card:var(--apis-paper);\n  --surface-tint:var(--apis-cream-light);\n  --surface-inverse:var(--apis-off-black);\n  --surface-accent:var(--apis-dark-green);\n\n  /* Semantic, text */\n  --text-strong:#1c1208;\n  --text-body:#33241a;\n  --text-muted:#4a5c2a;      /* dark green doubles as the muted ink */\n  --text-accent:var(--apis-terracotta);\n  --text-on-dark:var(--apis-off-white);\n  --text-on-dark-muted:rgba(253,249,241,0.6);\n  --text-eyebrow-on-dark:var(--apis-yellow-1);\n\n  /* Semantic, interactive */\n  --action-primary:var(--apis-terracotta);\n  --action-primary-hover:var(--apis-terracotta-dark);\n  --action-primary-ink:var(--apis-off-white);\n  --action-gold:var(--apis-yellow-2);\n  --action-gold-hover:var(--apis-yellow-3);\n  --action-gold-ink:var(--apis-off-black);\n  --focus-ring:var(--apis-terracotta);\n\n  /* Semantic, lines */\n  --border-hairline:rgba(74,92,42,0.2);\n  --border-strong:rgba(74,92,42,0.45);\n  --border-on-dark:rgba(253,249,241,0.3);\n  --rule-accent:var(--apis-dark-green);\n}\n<\u002Fstyle>\n<style>/* APIS type system: Lora for headlines, stage titles, deliverable names and the founder\n   byline; DM Sans for labels, body, timings and eyebrows. */\n:root{\n  --font-display:'Lora',Georgia,'Times New Roman',serif;\n  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;\n\n  --weight-light:300; /* @kind other */\n  --weight-regular:400; /* @kind other */\n  --weight-medium:500; /* @kind other */\n  --weight-semibold:600; /* @kind other */\n\n  /* Display, Lora at 400. No italics, no two-tone headlines: emphasis is weight 600\n     in the same ink. */\n  --weight-display:400; /* @kind other */\n  --weight-display-em:600; /* @kind other */\n  --track-display:-0.01em; /* @kind other */\n  --text-display-1:clamp(2.5rem,4vw,3.75rem);   /* hero h1 */\n  --text-display-2:clamp(2.3rem,4.5vw,3.6rem);  /* page hero h1 */\n  --text-display-3:clamp(2rem,3.5vw,3rem);      /* section title */\n  --text-display-4:1.8rem;                      /* band title */\n  --text-display-5:1.6rem;                      /* card / stat title */\n  --line-display:1.12; /* @kind other */\n  --line-display-tight:1.08; /* @kind other */\n\n  /* Body */\n  --text-lead:1rem;      /* 1.7-1.85 line-height */\n  --text-body-md:0.98rem;\n  --text-body-sm:0.85rem;\n  --text-body-xs:0.82rem;\n  --line-body:1.8; /* @kind other */\n  --line-body-tight:1.6; /* @kind other */\n\n  /* Eyebrow / label, uppercase, wide tracking, terracotta on light */\n  --text-eyebrow:0.68rem;\n  --text-eyebrow-lg:0.72rem;\n  --track-eyebrow:0.22em; /* @kind other */\n  --track-eyebrow-wide:0.25em; /* @kind other */\n\n  /* UI / buttons / nav */\n  --text-ui:0.8rem;\n  --text-ui-sm:0.75rem;\n  --text-micro:0.65rem;\n  --track-ui:0.1em; /* @kind other */\n  --track-ui-wide:0.12em; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Rem-based rhythm as used across apisinstitute.org */\n:root{\n  --space-3xs:0.2rem;\n  --space-2xs:0.4rem;\n  --space-xs:0.55rem;\n  --space-sm:0.75rem;\n  --space-md:1rem;\n  --space-lg:1.25rem;\n  --space-xl:1.5rem;\n  --space-2xl:2rem;\n  --space-3xl:2.5rem;\n  --space-4xl:3rem;\n  --space-5xl:3.5rem;\n  --space-6xl:5rem;\n  --space-7xl:6rem;\n\n  /* Section padding: generous vertical, 3rem gutter desktop / 1.5rem mobile */\n  --section-pad-y:5rem;\n  --section-pad-y-lg:6rem;\n  --gutter:3rem;\n  --gutter-mobile:1.5rem;\n\n  /* Measures */\n  --measure-page:1200px;\n  --measure-wide:960px;\n  --measure-prose:780px;\n  --measure-narrow:640px;\n  --measure-text:480px;\n}\n<\u002Fstyle>\n<style>/* Radii, shadows, rules, textures. APIS is a near-square brand: 2px is the only radius\n   on rectangles; circles are reserved for icon chips and the logo's flower. */\n:root{\n  --radius-sharp:2px;\n  --radius-pill:999px;\n  --radius-circle:50%;\n\n  --shadow-card:0 4px 16px rgba(0,0,0,0.08);\n  --shadow-none:none;\n\n  --rule-hairline:1px solid var(--border-hairline); /* @kind other */\n  --rule-topper:2px solid var(--apis-dark-green); /* @kind other */   /* step cards */\n  --rule-topper-thick:3px solid var(--apis-dark-green); /* @kind other */ /* dark sidebars */\n  --rule-quote:1px solid var(--border-hairline); /* @kind other */ /* pull-quote frame, hairline on all four sides */\n  --divider-fade:linear-gradient(90deg,transparent,var(--border-hairline),transparent); /* @kind color */\n\n  --blur-nav:blur(12px); /* @kind other */\n  --scrim-photo:linear-gradient(rgba(28,18,8,0.45),rgba(28,18,8,0.5)); /* @kind color */\n  --photo-filter:sepia(10%) contrast(1.02); /* @kind other */\n\n  --glow-terracotta:radial-gradient(ellipse 50% 70% at 80% 30%,rgba(139,58,30,0.3) 0%,transparent 65%); /* @kind color */\n  --glow-green:radial-gradient(ellipse 40% 50% at 15% 70%,rgba(74,92,42,0.25) 0%,transparent 60%); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* Motion is restrained: short colour fades, 1px lifts, one long scroll reveal. */\n:root{\n  --dur-fast:0.15s; /* @kind other */\n  --dur-base:0.2s; /* @kind other */\n  --dur-slow:0.3s; /* @kind other */\n  --dur-reveal:0.7s; /* @kind other */\n  --dur-carousel:0.6s; /* @kind other */\n  --ease-default:ease; /* @kind other */\n  --lift-hover:translateY(-1px); /* @kind other */\n  --reveal-offset:24px;\n}\n<\u002Fstyle>\n<style>/* APIS webfonts: Lora for headlines, stage titles, deliverable names and the founder\n   byline; DM Sans for everything else. Both served from Google Fonts. No self-hosted\n   binaries were provided; if brand-licensed files exist, drop them in assets/fonts/\n   and replace this import. */\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"f8d3ef70-ce69-4197-87e0-4f90b854ec66\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"bf64cc28-28f2-440d-999c-dfc016e279b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f8d3ef70-ce69-4197-87e0-4f90b854ec66\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bf64cc28-28f2-440d-999c-dfc016e279b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+219 oney, light     · Pantone 148 C */\n  --apis-yellow-2:#c8842a;    /* burnt gold, mid  · Pantone 1355 C */\n  --apis-yellow-3:#a86a1e;    /* deep gold         · Pantone 4025 C */\n\n  /* Derived, used in production for hover/press and tinted grounds */\n  --apis-terracotta-dark:#6f2d14;\n  --apis-cream-sage:#f3e9d7;  /* off-white + green tint */\n  --apis-cream-clay:#f7ece0;  /* off-white + clay tint */\n  --apis-paper:#fffdf9;       /* default page ground, a whisper off white */\n  --apis-cream-light:#f8f1e6; /* lighter tinted ground */\n\n  /* Semantic, surfaces */\n  --surface-page:var(--apis-paper);      /* white by default; reach for a tint only to separate a band */\n  --surface-alt:var(--apis-cream-sage);\n  --surface-alt-warm:var(--apis-cream-clay);\n  --surface-card:var(--apis-paper);\n  --surface-tint:var(--apis-cream-light);\n  --surface-inverse:var(--apis-off-black);\n  --surface-accent:var(--apis-dark-green);\n\n  /* Semantic, text */\n  --text-strong:#1c1208;\n  --text-body:#33241a;\n  --text-muted:#4a5c2a;      /* dark green doubles as the muted ink */\n  --text-accent:var(--apis-terracotta);\n  --text-on-dark:var(--apis-off-white);\n  --text-on-dark-muted:rgba(253,249,241,0.6);\n  --text-eyebrow-on-dark:var(--apis-yellow-1);\n\n  /* Semantic, interactive */\n  --action-primary:var(--apis-terracotta);\n  --action-primary-hover:var(--apis-terracotta-dark);\n  --action-primary-ink:var(--apis-off-white);\n  --action-gold:var(--apis-yellow-2);\n  --action-gold-hover:var(--apis-yellow-3);\n  --action-gold-ink:var(--apis-off-black);\n  --focus-ring:var(--apis-terracotta);\n\n  /* Semantic, lines */\n  --border-hairline:rgba(74,92,42,0.2);\n  --border-strong:rgba(74,92,42,0.45);\n  --border-on-dark:rgba(253,249,241,0.3);\n  --rule-accent:var(--apis-dark-green);\n}\n\n/* APIS type system: Lora for headlines, stage titles, deliverable names and the founder\n   byline; DM Sans for labels, body, timings and eyebrows. */\n:root{\n  --font-display:'Lora',Georgia,'Times New Roman',serif;\n  --font-sans:'DM Sans',system-ui,-apple-system,sans-serif;\n\n  --weight-light:300; /* @kind other */\n  --weight-regular:400; /* @kind other */\n  --weight-medium:500; /* @kind other */\n  --weight-semibold:600; /* @kind other */\n\n  /* Display, Lora at 400. No italics, no two-tone headlines: emphasis is weight 600\n     in the same ink. */\n  --weight-display:400; /* @kind other */\n  --weight-display-em:600; /* @kind other */\n  --track-display:-0.01em; /* @kind other */\n  --text-display-1:clamp(2.5rem,4vw,3.75rem);   /* hero h1 */\n  --text-display-2:clamp(2.3rem,4.5vw,3.6rem);  /* page hero h1 */\n  --text-display-3:clamp(2rem,3.5vw,3rem);      /* section title */\n  --text-display-4:1.8rem;                      /* band title */\n  --text-display-5:1.6rem;                      /* card / stat title */\n  --line-display:1.12; /* @kind other */\n  --line-display-tight:1.08; /* @kind other */\n\n  /* Body */\n  --text-lead:1rem;      /* 1.7-1.85 line-height */\n  --text-body-md:0.98rem;\n  --text-body-sm:0.85rem;\n  --text-body-xs:0.82rem;\n  --line-body:1.8; /* @kind other */\n  --line-body-tight:1.6; /* @kind other */\n\n  /* Eyebrow / label, uppercase, wide tracking, terracotta on light */\n  --text-eyebrow:0.68rem;\n  --text-eyebrow-lg:0.72rem;\n  --track-eyebrow:0.22em; /* @kind other */\n  --track-eyebrow-wide:0.25em; /* @kind other */\n\n  /* UI / buttons / nav */\n  --text-ui:0.8rem;\n  --text-ui-sm:0.75rem;\n  --text-micro:0.65rem;\n  --track-ui:0.1em; /* @kind other */\n  --track-ui-wide:0.12em; /* @kind other */\n}\n\n/* Rem-based rhythm as used across apisinstitute.org */\n:root{\n  --space-3xs:0.2rem;\n  --space-2xs:0.4rem;\n  --space-xs:0.55rem;\n  --space-sm:0.75rem;\n  --space-md:1rem;\n  --space-lg:1.25rem;\n  --space-xl:1.5rem;\n  --space-2xl:2rem;\n  --space-3xl:2.5rem;\n  --space-4xl:3rem;\n  --space-5xl:3.5rem;\n  --space-6xl:5rem;\n  --space-7xl:6rem;\n\n  /* Section padding: generous vertical, 3rem gutter desktop / 1.5rem mobile */\n  --section-pad-y:5rem;\n  --section-pad-y-lg:6rem;\n  --gutter:3rem;\n  --gutter-mobile:1.5rem;\n\n  /* Measures */\n  --measure-page:1200px;\n  --measure-wide:960px;\n  --measure-prose:780px;\n  --measure-narrow:640px;\n  --measure-text:480px;\n}\n\n/* Radii, shadows, rules, textures. APIS is a near-square brand: 2px is the only radius\n   on rectangles; circles are reserved for icon chips and the logo's flower. */\n:root{\n  --radius-sharp:2px;\n  --radius-pill:999px;\n  --radius-circle:50%;\n\n  --shadow-card:0 4px 16px rgba(0,0,0,0.08);\n  --shadow-none:none;\n\n  --rule-hairline:1px solid var(--border-hairline); /* @kind other */\n  --rule-topper:2px solid var(--apis-dark-green); /* @kind other */   /* step cards */\n  --rule-topper-thick:3px solid var(--apis-dark-green); /* @kind other */ /* dark sidebars */\n  --rule-quote:1px solid var(--border-hairline); /* @kind other */ /* pull-quote frame, hairline on all four sides */\n  --divider-fade:linear-gradient(90deg,transparent,var(--border-hairline),transparent); /* @kind color */\n\n  --blur-nav:blur(12px); /* @kind other */\n  --scrim-photo:linear-gradient(rgba(28,18,8,0.45),rgba(28,18,8,0.5)); /* @kind color */\n  --photo-filter:sepia(10%) contrast(1.02); /* @kind other */\n\n  --glow-terracotta:radial-gradient(ellipse 50% 70% at 80% 30%,rgba(139,58,30,0.3) 0%,transparent 65%); /* @kind color */\n  --glow-green:radial-gradient(ellipse 40% 50% at 15% 70%,rgba(74,92,42,0.25) 0%,transparent 60%); /* @kind color */\n}\n\n/* Motion is restrained: short colour fades, 1px lifts, one long scroll reveal. */\n:root{\n  --dur-fast:0.15s; /* @kind other */\n  --dur-base:0.2s; /* @kind other */\n  --dur-slow:0.3s; /* @kind other */\n  --dur-reveal:0.7s; /* @kind other */\n  --dur-carousel:0.6s; /* @kind other */\n  --ease-default:ease; /* @kind other */\n  --lift-hover:translateY(-1px); /* @kind other */\n  --reveal-offset:24px;\n}\n\n<\u002Fstyle>\n<script src=\"26eb7f16-6170-4308-a190-a90d0d62e63e\"><\u002Fscript>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>body{margin:0;background:#fffdf9} @media (max-width:600px){[data-grads]{grid-template-columns:1fr !important;grid-template-rows:none !important;grid-auto-flow:row !important}} a{color:#8b3a1e;text-decoration:none} a:hover{color:#6f2d14;text-decoration:underline} @media print{.apis-screen-only{display:none !important}} @media screen{.apis-print-only{display:none !important}}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:780px;margin:0 auto;padding:2.5rem 1.25rem 4rem;box-sizing:border-box;background:#fffdf9\">\n<div style=\"font-family:'DM Sans',system-ui,sans-serif;font-weight:300;color:#33241a;font-size:10.5pt;line-height:1.7\">\n\n<div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 2rem;padding-bottom:1.25rem;border-bottom:1px solid rgba(74,92,42,0.2)\">\n<img src=\"32630e4a-d3e4-4426-9191-86df098139ae\" alt=\"APIS, Applied Pollination Institute of Science\" style=\"height:64px;width:auto;display:block\">\n<div style=\"text-align:right;font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.18em;text-transform:uppercase;color:#4a5c2a;line-height:1.8\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;margin:1.75rem 0 2rem;height:300px;overflow:hidden;border-radius:2px;background:#1c1208;break-inside:avoid\">\n<img src=\"114e85c0-b9cd-4418-826e-95dc7d416e34\" alt=\"Honey bee pollinating blueberry blossoms\" style=\"width:160%;max-width:none;height:300px;object-fit:cover;object-position:center 47%;display:block;filter:sepia(10%) contrast(1.02)\">\n<div style=\"position:absolute;inset:0;background:linear-gradient(rgba(28,18,8,0.05) 35%, rgba(28,18,8,0.7))\"><\u002Fdiv>\n<h1 style=\"position:absolute;left:1.75rem;right:1.75rem;bottom:2.1rem;font-family:'Lora',Georgia,serif;font-weight:400;letter-spacing:-0.01em;font-size:clamp(20pt,5vw,24pt);line-height:1.12;color:#fdf9f1;margin:0;max-width:640px;text-shadow:0 1px 8px rgba(0,0,0,0.35)\">APIS Certified Pollination Advisor<br>Course <span style=\"font-weight:600\"><span style=\"font-weight: normal;\">Sponsorship<\u002Fspan><\u002Fspan><\u002Fh1>\n<div style=\"position:absolute;bottom:8px;left:1.75rem;color:rgba(253,249,241,0.9);font-size:7pt;text-shadow:0 1px 3px rgba(0,0,0,0.8)\">Photo: A. De la Luz<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Lora',Georgia,serif;font-weight:400;letter-spacing:-0.01em;font-size:19pt;line-height:1.15;color:#1c1208;margin:0 0 1rem\">About the Program<\u002Fh2>\n<p style=\"margin:0 0 1rem\">The APIS Certified Pollination Advisor program trains agricultural advisors to assess and manage pollination on working farms. It is developed by Dr. Angelita De la Luz, founder of the Applied Pollination Institute of Science and hosted by Washington State University Global Campus.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem 1.75rem;margin:1.5rem 0;break-inside:avoid\">\n<div><p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.18em;text-transform:uppercase;color:#4a5c2a;font-weight:500;margin:0 0 0.4rem\">Hosted by Washington State University<\u002Fp><p style=\"margin:0;font-size:9.5pt;line-height:1.65\">The course is delivered through WSU's global campus platform, with sign-off from WSU faculty and university leadership.&nbsp; This means sponsors back a university-hosted program with academic oversight, not a standalone private training.<\u002Fp><\u002Fdiv>\n<div><p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.18em;text-transform:uppercase;color:#4a5c2a;font-weight:500;margin:0 0 0.4rem\">Who It Serves<\u002Fp><p style=\"margin:0;font-size:9.5pt;line-height:1.65\">PCAs, crop consultants, agronomists, and grower-facing staff at packers, marketers, and input companies. This matters because these advisors are already at the front lines during bloom, making the calls growers act on often without formal pollination training.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#1c1208;border-radius:2px;padding:1.25rem 1.5rem;margin:0 0 1.5rem;break-inside:avoid\">\n<p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.18em;text-transform:uppercase;color:#e8bd6d;font-weight:500;margin:0 0 0.8rem\">What Graduates Can Do<\u002Fp>\n<ul style=\"list-style:none;margin:0;padding:0;font-size:10pt;line-height:1.55;color:#fdf9f1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:2rem;row-gap:0.55rem\" data-grads=\"\">\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Assess pollination needs by crop and bloom stage<\u002Fli>\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Evaluate stocking density, colony quality, and placement strategy<\u002Fli>\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Flag pesticide risks to pollinators during bloom<\u002Fli>\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Assess pollination adequacy and whether pollination spend is paying off<\u002Fli>\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Advise growers on managed and wild pollinator strategies and emerging technologies<\u002Fli>\n<li style=\"position:relative;padding-left:2.1rem;min-height:1.9em\"><img src=\"a18957fa-4249-4bd1-9b11-cf5aac38cf5f\" alt=\"\" style=\"position:absolute;left:0;top:-0.1em;width:auto;height:1.9em;display:block\">Identify forage and habitat gaps<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<p style=\"margin:0 0 1rem\"><span style=\"font-weight:500;color:#1c1208\">Why sponsor.<\u002Fspan> Your support builds a trained advisor workforce in the regions and crops you depend on, and places your organization at the start of a new professional standard, alongside Washington State University from the first cohort.<\u002Fp>\n<p style=\"margin:0 0 2.25rem\"><span style=\"font-weight: 500; color: rgb(28, 18, 8);\">Launch.<\u002Fspan> First cohort opens in November 2026. (Spanish language in 2027)<\u002Fp>\n\n\n<h2 style=\"font-family:'Lora',Georgia,serif;font-weight:400;letter-spacing:-0.01em;font-size:19pt;line-height:1.15;color:#1c1208;margin:0 0 1.25rem\">Sponsorship Levels<\u002Fh2>\n\n<div style=\"border-top:2px solid #4a5c2a;padding:0.9rem 0 1.4rem;display:flex;flex-wrap:wrap;gap:0.75rem 1.5rem;break-inside:avoid\">\n<div style=\"flex:0 0 150px\"><p style=\"font-family:'Lora',Georgia,serif;font-size:14pt;color:#1c1208;margin:0;line-height:1.25\">Founding Sponsor<\u002Fp><p style=\"font-size:18pt;font-weight:500;color:#8b3a1e;margin:0.35rem 0 0;line-height:1\">$5,000+<\u002Fp><\u002Fdiv>\n<ul style=\"flex:1 1 300px;min-width:0;list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.55\">\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Recognition as a Founding Sponsor of the APIS Certified Pollination Advisor program, listed first and largest on all sponsor materials<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Logo on course materials, the program web page, and the certificate issued to every Year 1 graduate<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Two (2) complimentary seats for your staff, growers, or advisors<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>One (1) seat on the Curriculum Review Panel to provide industry input on base course content with the opportunity to propose field sites or grower case studies (final content decisions made by APIS)<ul style=\"list-style: none; margin: 0px; padding: 0px; font-size: 9.5pt; line-height: 1.55;\"><\u002Ful><\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Recognition in the course launch announcement<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Recognition in the Year 1 program summary<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"border-top:2px solid #4a5c2a;padding:0.9rem 0 1.4rem;display:flex;flex-wrap:wrap;gap:0.75rem 1.5rem;break-inside:avoid\">\n<div style=\"flex:0 0 150px\"><p style=\"font-family:'Lora',Georgia,serif;font-size:14pt;color:#1c1208;margin:0;line-height:1.25\">Module Sponsor<\u002Fp><p style=\"font-size:18pt;font-weight:500;color:#8b3a1e;margin:0.35rem 0 0;line-height:1\">$3,000<\u002Fp><\u002Fdiv>\n<ul style=\"flex:1 1 300px;min-width:0;list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.55\">\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>\"Supported by\" credit and logo on a core or crop-specific module (for example, almonds, blueberries, caneberries, avocados, controlled environments, etc.)<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>One (1) season on the specified crop's industry input group, with the opportunity to propose field sites or grower case studies (final content decisions determined by APIS and WSU)<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>One (1) complimentary seat<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Logo on the program web page<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Recognition in the launch announcement<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>First option to renew sponsorship of the same module in Year 2<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"border-top:2px solid #4a5c2a;border-bottom:1px solid rgba(74,92,42,0.2);padding:0.9rem 0 1.4rem;display:flex;flex-wrap:wrap;gap:0.75rem 1.5rem;break-inside:avoid\">\n<div style=\"flex:0 0 150px\"><p style=\"font-family:'Lora',Georgia,serif;font-size:14pt;color:#1c1208;margin:0;line-height:1.25\">Supporter<\u002Fp><p style=\"font-size:18pt;font-weight:500;color:#8b3a1e;margin:0.35rem 0 0;line-height:1\">$750<\u002Fp><\u002Fdiv>\n<ul style=\"flex:1 1 300px;min-width:0;list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.55\">\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Logo on the program web page<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Recognition in the launch announcement<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Option to support a specific crop: logo on that crop module's page and a place in the crop's industry input group<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n\n<h2 style=\"font-family:'Lora',Georgia,serif;font-weight:400;letter-spacing:-0.01em;font-size:19pt;line-height:1.15;color:#1c1208;margin:3rem 0 0.5rem\">Add ons: Available on their own or with any level<\u002Fh2>\n<p style=\"margin:0 0 1.25rem;color:#4a5c2a;font-size:9.5pt\">Fund seats for advisors who would not otherwise enroll, or research that feeds directly into the course.<\u002Fp>\n\n<div style=\"border-top:2px solid #4a5c2a;padding:0.9rem 0 1.4rem;display:flex;flex-wrap:wrap;gap:0.75rem 1.5rem;break-inside:avoid\">\n<div style=\"flex:0 0 150px\"><p style=\"font-family:'Lora',Georgia,serif;font-size:14pt;color:#1c1208;margin:0;line-height:1.25\">Scholarship Sponsor<\u002Fp><p style=\"font-size:18pt;font-weight:500;color:#8b3a1e;margin:0.35rem 0 0;line-height:1\">$1,500<\u002Fp><\u002Fdiv>\n<ul style=\"flex:1 1 300px;min-width:0;list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.55\">\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Funds one (1) full scholarship seat for an advisor or grower who would not otherwise enroll<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Scholarships named for your organization (for example, \"The [Company] Pollination Scholarship\")<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Recipient announcement you can share with your network<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Logo on the program web page<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"border-top:2px solid #4a5c2a;border-bottom:1px solid rgba(74,92,42,0.2);padding:0.9rem 0 1.4rem;display:flex;flex-wrap:wrap;gap:0.75rem 1.5rem;break-inside:avoid\">\n<div style=\"flex:0 0 150px\"><p style=\"font-family:'Lora',Georgia,serif;font-size:14pt;color:#1c1208;margin:0;line-height:1.25\">Research Fellowship<\u002Fp><p style=\"font-size:12pt;font-weight:500;color:#8b3a1e;margin:0.45rem 0 0;line-height:1.2\">$1000-$5000<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0\">\n<p style=\"margin:0 0 0.8rem;font-size:9.5pt;line-height:1.65\">Sponsors can fund applied pollination research that feeds directly into the course. Each fellowship supports a graduate student or early-career researcher at APIS in partnership with Washington State University working on questions raised by the crop industry input groups.<\u002Fp>\n<ul style=\"list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.55\">\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Named fellowship (for example, \"The [Company] APIS Pollination Research Fellowship\")<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Research questions drawn from the crop industry input groups, not individual sponsors<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Findings published regardless of outcome and incorporated into APIS Certified Pollination Advisor course materials<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Sponsor acknowledged as funder in resulting publications and course materials<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem;margin-bottom:0.4rem\"><span style=\"position:absolute;left:0;top:0.6em;width:5px;height:5px;border-radius:50%;background:#8b3a1e;display:block\"><\u002Fspan>Summary of results shared with sponsors at the end of the fellowship<\u002Fli>\n<li style=\"position:relative;padding-left:1.1rem\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Fellowship funds are paid directly to Washington State University, not to APIS Institute, and may be tax-deductible. Inclusion after payment confirmation<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#f3e9d7;border:1px solid rgba(74,92,42,0.2);border-radius:2px;padding:1.4rem 1.6rem;margin:2.25rem 0 2.25rem;break-inside:avoid\">\n<p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.22em;text-transform:uppercase;color:#8b3a1e;margin:0 0 0.5rem\">SCIENTIFIC INDEPENDENCE POLICY<\u002Fp>\n<p style=\"margin: 0; font-size: 9.5pt; line-height: 1.7\">The value of the APIS Certified Pollination Advisor credential relies on its independence. Sponsors may offer input through the Curriculum Review Panel, but APIS Institute retains full control over course content, recommendations, and assessment with approval by WSU. Sponsorship does not include or imply exclusivity, course ownership, product endorsement or placement in course material.<\u002Fp>\n<\u002Fdiv>\n\n\n\n<div style=\"break-before:page;border:1px solid rgba(74,92,42,0.2);border-radius:2px;overflow:hidden\">\n<div style=\"background:#1c1208;padding:1rem 1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 2rem\" data-comment-anchor=\"7a17a68623-div\">\n<div style=\"flex:1 1 300px;min-width:0\">\n<p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.22em;text-transform:uppercase;color:#e8bd6d;margin:0 0 0.5rem\">To Become a Sponsor<\u002Fp>\n<p style=\"font-family:'Lora',Georgia,serif;font-size:17pt;line-height:1.2;color:#fdf9f1;margin:0\">Commit below in a few minutes<\u002Fp>\n<p style=\"font-size:9pt;color:rgba(253,249,241,0.8);margin:0.5rem 0 0;line-height:1.6\">Choose your level and enter your details. Your invoice arrives by email, ready to pay online.<\u002Fp>\n<p style=\"font-size:9pt;color:rgba(253,249,241,0.8);margin:0.9rem 0 0;line-height:1.6\">Questions? <a href=\"mailto:hello@apisinstitute.org\" style=\"color:#e8bd6d;text-decoration:none\">hello@apisinstitute.org<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<div style=\"flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem\">\n<img src=\"587db023-4c81-4c10-aa89-557373290a2e\" alt=\"APIS Certified\" style=\"height:64px;width:auto;display:block\">\n<span style=\"font-family:'Lora',Georgia,serif;font-size:7.5pt;letter-spacing:0.22em;text-transform:uppercase;color:#8d9a6b\">Pollination Advisor<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"reserve\" style=\"margin-top:2.25rem\">\n\n\n<div style=\"border:1px solid rgba(74,92,42,0.2);border-radius:2px;overflow:hidden;background:#fffdf9\">\n<iframe id=\"ziframe_113323\" aria-label=\"Sponsor Form\" title=\"APIS sponsorship form\" src=\"https://forms.zohopublic.com/adelaluzapisin1/form/SponsorForm/formperma/0LRVWfgWjyvjCFE96VkGLfNzoGoCJDXIJUXy2hbYPao\" style=\"display:block;width:100%;height:1400px;border:none\"><\u002Fiframe>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"break-inside:avoid;margin-top:2.25rem\">\n<p style=\"font-family:'Lora',Georgia,serif;font-size:8pt;letter-spacing:0.22em;text-transform:uppercase;color:#8b3a1e;margin:0 0 0.8rem\">Terms<\u002Fp>\n<ul style=\"list-style:none;margin:0;padding:0;font-size:9.5pt;line-height:1.6\">\n<li style=\"position: relative; padding: 0 0 0 1.1rem; margin-bottom: 0.4rem; font-size: 9.5pt\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Sponsorship payments (all levels and the Scholarship add-on) are made to APIS Institute LLC and are invoiced as program sponsorship. Research Fellowship funds are the exception and are paid directly to Washington State University<\u002Fli>\n<li style=\"position: relative; padding: 0 0 0 1.1rem; margin-bottom: 0.4rem; font-size: 9.5pt\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Invoice to be sent upon confirmation of commitment. Payment is due within 7 business days of commitment.&nbsp;<\u002Fli>\n<li style=\"position: relative; padding: 0 0 0 1.1rem; margin-bottom: 0.4rem; font-size: 9.5pt\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Founding Sponsor benefits apply to commitments received by November 15th, 2026<\u002Fli>\n<li style=\"position: relative; padding: 0 0 0 1.1rem; margin-bottom: 0.4rem; font-size: 9.5pt\"><span style=\"position: absolute; left: 0px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: rgb(139, 58, 30); display: block;\"><\u002Fspan>Logos and recognition materials are due within 10 days of commitment to be included in launch materials.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
